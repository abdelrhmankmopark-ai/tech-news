<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECH NEWS | أخبار التقنية</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
transition:.3s;
}

header{
padding:22px 6%;
background:#111a30;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
border-bottom:1px solid #29344d;
}

.logo{font-size:25px;font-weight:bold;color:#38bdf8}
.logo span{color:white}

button{
border:0;
padding:11px 16px;
border-radius:9px;
cursor:pointer;
background:#1689c7;
color:white;
font-weight:bold;
}

.hero{
padding:55px 7%;
background:linear-gradient(120deg,#123b67,#111a30);
}

.hero h1{font-size:35px;margin-bottom:15px}
.hero p{color:#cbd5e1;line-height:1.8}

.search{
margin-top:25px;
width:100%;
max-width:500px;
padding:15px;
border:1px solid #475569;
border-radius:10px;
background:#0b1020;
color:white;
font-size:16px;
}

.categories{
display:flex;
gap:10px;
padding:25px 6%;
flex-wrap:wrap;
}

.categories button{background:#26344f}
.categories button.active{background:#1689c7}

.title{
padding:10px 6%;
font-size:23px;
}

.news{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px 6% 50px;
}

.card{
background:#17223a;
border:1px solid #293953;
border-radius:15px;
overflow:hidden;
transition:.3s;
}

.card:hover{transform:translateY(-5px)}

.card img{
width:100%;
height:165px;
object-fit:cover;
}

.content{padding:17px}
.tag{color:#38bdf8;font-size:13px}
.card h3{margin:12px 0;line-height:1.6}
.card p{color:#aebbd0;line-height:1.7;font-size:14px}
.card button{margin-top:15px}

footer{
text-align:center;
padding:30px;
background:#111a30;
color:#aebbd0;
}

body.light{
background:#f1f5f9;
color:#111827;
}
body.light header,
body.light footer{background:#fff;color:#111827}
body.light .card{background:white;color:#111827}
body.light .card p{color:#475569}
body.light .hero{background:#dbeafe;color:#111827}
body.light .hero p{color:#334155}
body.light .search{background:white;color:#111}
</style>
</head>

<body>

<header>
<div class="logo">TECH <span>NEWS</span></div>
<button onclick="toggleTheme()">🌙 تغيير المظهر</button>
</header>

<section class="hero">
<h1>عالم التكنولوجيا بين يديك 🚀</h1>
<p>تابع أحدث أخبار الذكاء الاصطناعي والهواتف والبرمجة والألعاب في مكان واحد.</p>
<input class="search" id="search"
placeholder="🔍 ابحث عن خبر..."
oninput="renderNews()">
</section>

<div class="categories">
<button class="active" onclick="filterNews('الكل',this)">الكل</button>
<button onclick="filterNews('ذكاء اصطناعي',this)">الذكاء الاصطناعي</button>
<button onclick="filterNews('هواتف',this)">الهواتف</button>
<button onclick="filterNews('برمجة',this)">البرمجة</button>
<button onclick="filterNews('ألعاب',this)">الألعاب</button>
</div>

<h2 class="title">📰 أحدث الأخبار</h2>

<section class="news" id="news"></section>

<footer>
<h3>TECH NEWS</h3>
<p>بوابتك إلى عالم التكنولوجيا</p>
<p>© 2026 جميع الحقوق محفوظة</p>
</footer>

<script>
const articles=[
{
title:"مستقبل الذكاء الاصطناعي",
category:"ذكاء اصطناعي",
desc:"تعرف على أهم استخدامات الذكاء الاصطناعي وكيف يغير عالم التكنولوجيا.",
img:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=600"
},
{
title:"عالم الهواتف الذكية",
category:"هواتف",
desc:"اكتشف أحدث الابتكارات في عالم الهواتف والتقنيات الحديثة.",
img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"
},
{
title:"تعلم البرمجة من الصفر",
category:"برمجة",
desc:"ابدأ رحلتك في تعلم HTML وCSS وJavaScript وصناعة المواقع.",
img:"https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=600"
},
{
title:"مستقبل ألعاب الفيديو",
category:"ألعاب",
desc:"كيف تتطور صناعة الألعاب باستخدام التقنيات الحديثة؟",
img:"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600"
},
{
title:"تقنيات المستقبل",
category:"ذكاء اصطناعي",
desc:"نظرة على التقنيات التي قد تغير حياتنا خلال السنوات القادمة.",
img:"https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600"
},
{
title:"أسرار عالم الكمبيوتر",
category:"برمجة",
desc:"تعرف على مكونات الكمبيوتر وأهم التقنيات المستخدمة فيه.",
img:"https://images.unsplash.com/photo-1518770660439-4636190af475?w=600"
}
];

let currentCategory="الكل";

function renderNews(){
const box=document.getElementById("news");
const query=document.getElementById("search").value.toLowerCase();

const filtered=articles.filter(a=>
(currentCategory==="الكل"||a.category===currentCategory)&&
(a.title.toLowerCase().includes(query)||
a.desc.toLowerCase().includes(query))
);

box.innerHTML=filtered.map(a=>`
<article class="card">
<img src="${a.img}" alt="">
<div class="content">
<span class="tag">${a.category}</span>
<h3>${a.title}</h3>
<p>${a.desc}</p>
<button onclick="alert('هذا خبر تجريبي، سيتم إضافة تفاصيل الأخبار لاحقاً.')">
اقرأ المزيد ←
</button>
</div>
</article>
`).join("");

if(filtered.length===0){
box.innerHTML="<p>لم يتم العثور على أخبار.</p>";
}
}

function filterNews(category,btn){
currentCategory=category;
document.querySelectorAll(".categories button")
.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderNews();
}

function toggleTheme(){
document.body.classList.toggle("light");
}

renderNews();
</script>

</body>
</html>
